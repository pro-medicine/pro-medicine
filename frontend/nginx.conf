server {
  listen 80;

  # Docker 내부 DNS로 backend 주소를 1초마다 다시 확인
  # → 백엔드 컨테이너가 바뀌어도 nginx 재시작 없이 새 컨테이너로 연결 (무중단 배포 + 502 방지)
  resolver 127.0.0.11 valid=1s ipv6=off;

  # 기본값은 서비스 이름. 배포 스크립트가 upstream/backend.conf로 실제 컨테이너를 지정하면 그 값이 적용됨
  set $backend http://backend:8080;
  include /etc/nginx/upstream/*.conf;

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  # 알림 SSE: 버퍼링 끄고 연결 오래 유지
  location /api/v1/notifications/subscribe {
    proxy_pass $backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
  }

  location /api/ {
    proxy_pass $backend;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}