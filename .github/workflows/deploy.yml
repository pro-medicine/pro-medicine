name: Deploy to EC2

on:
  push:
    # 테스트가 끝나면 feat/docker는 지우고 develop만 남기세요.
    branches: [develop]
  workflow_dispatch:

# 배포가 동시에 두 개 돌지 않도록 순서대로 실행
concurrency:
  group: deploy-ec2
  cancel-in-progress: false

# 이 워크플로는 코드를 읽기만 함
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 받기
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # ---------- 백엔드 빌드 ----------
      - name: Java 21 설치
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            backend/*.gradle*
            backend/gradle/wrapper/gradle-wrapper.properties

      - name: application.yml 생성 (Git 미포함 파일)
        env:
          APPLICATION_YML: ${{ secrets.APPLICATION_YML }}
        run: |
          mkdir -p backend/src/main/resources
          printf '%s\n' "$APPLICATION_YML" > backend/src/main/resources/application.yml

      - name: 백엔드 jar 빌드
        working-directory: backend
        run: |
          chmod +x gradlew
          ./gradlew clean bootJar -x test --no-daemon

      # ---------- 프론트 빌드 ----------
      - name: Node 22 설치
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 프론트 빌드
        working-directory: frontend
        env:
          VITE_KAKAO_JAVASCRIPT_KEY: ${{ secrets.VITE_KAKAO_JAVASCRIPT_KEY }}
        run: |
          npm ci
          npm run build

            # ---------- 결과물 정리 ----------
      - name: 배포 파일 모으기
        run: |
          mkdir -p deploy/backend deploy/frontend
          cp "$(ls backend/build/libs/*.jar | grep -v -- '-plain.jar$')" deploy/backend/app.jar
          cp -r frontend/dist deploy/frontend/dist

      # ---------- EC2로 전송 ----------
      - name: EC2로 파일 전송
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "deploy/*"
          target: "~/pro-medicine-artifacts"
          strip_components: 1
          rm: true

      # ---------- EC2에서 무중단 배포 ----------
      - name: EC2에서 배포 스크립트 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 20m
          script: |
            set -e
            cd ~/pro-medicine
            git fetch origin
            git checkout ${{ github.ref_name }}
            git reset --hard ${{ github.sha }}
            bash scripts/deploy.sh