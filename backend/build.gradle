plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ucamp'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	// 추천 단계별 지연 측정 (STEP 04): /actuator/prometheus
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-prometheus'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
//	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
//	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// 테스트 전용 DB (MySQL 모드). 실제 MySQL 없이 테스트를 돌리기 위해 사용
	testRuntimeOnly 'com.h2database:h2'
	// LLM HTTP 클라이언트 테스트·장애 주입용 가짜 서버 (부하 테스트용 standalone 실행은 docs/perf 문서 참고)
	testImplementation 'org.wiremock:wiremock-standalone:3.13.2'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform {
		// 실제 API(live), 성능 측정(perf), 평가 실행(eval)은 기본 테스트에서 제외
		excludeTags 'live', 'perf', 'eval'
	}
}

// 평가 실행 (STEP 04): ./gradlew evalRun -PpipelineVersion=V0 [-Pcases=30] [-Prepeats=1] [-Pmode=repro] [-Pllm=fake] [-Pconfirm=true]
// -Pconfirm=true가 없으면 실제 API(-Pllm=anthropic, 기본값)는 예상 호출 수·비용만 출력하고 끝낸다
tasks.register('evalRun', Test) {
	description = '추천 품질 평가 실행 (평가셋 → results.csv)'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'eval' }
	['pipelineVersion', 'cases', 'repeats', 'mode', 'llm', 'confirm', 'model', 'label', 'note', 'step', 'routing'].each { key ->
		if (project.hasProperty(key)) {
			systemProperty "eval.${key}", project.property(key)
		}
	}
	testLogging { showStandardStreams = true }
	outputs.upToDateWhen { false }
}

// 실제 Claude API 테스트: ./gradlew liveTest (ANTHROPIC_API_KEY 필요, 비용 발생)
tasks.register('liveTest', Test) {
	description = '실제 Claude API 호출 테스트 (비용 발생)'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'live' }
	testLogging { showStandardStreams = true }
	outputs.upToDateWhen { false }
}

// 성능 측정 테스트: ./gradlew perfTest
tasks.register('perfTest', Test) {
	description = '로컬 성능 측정 테스트 (H2, MockMvc)'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'perf' }
	systemProperty 'perf.label', findProperty('perfLabel') ?: 'run'
	testLogging { showStandardStreams = true }
	outputs.upToDateWhen { false }
}
