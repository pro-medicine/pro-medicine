# AI 추천 기능의 기본 설정. 팀 공통 application.yml을 건드리지 않으려고 따로 둔다.
# @PropertySource로 읽기 때문에 application.yml / 프로필 / 실행 인자에 같은 키가 있으면 그쪽이 우선한다.

# 단계별 지연 측정 노출 (STEP 04)
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# 결과 캐시 (STEP 08). memory | redis. Redis 서버가 없어도 앱·테스트가 돌도록 기본은 memory
recommendation.cache.store=memory
recommendation.cache.ttl=7d
# Redis를 쓰지 않는 동안 /actuator/health가 Redis 때문에 DOWN이 되지 않게 끈다 (store=redis면 켜도 됨)
management.health.redis.enabled=false
# Spring Data Redis 저장소 스캔은 쓰지 않는다 (JPA 저장소와 섞이지 않게)
spring.data.redis.repositories.enabled=false

# LLM (Spring AI). 기본은 Spring AI 모델을 만들지 않는다 → API 키 없이도 서버·테스트가 뜬다 (llm.provider=fake)
# 실제 API는 application-local-llm.yml에서 spring.ai.model.chat=openai, llm.provider=spring-ai로 켠다
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.moderation=none
# API 키는 파일에 쓰지 않는다: OS 환경변수 또는 backend/.env(Git 제외)의 OPENAI_API_KEY
spring.ai.openai.api-key=${OPENAI_API_KEY:}
# 재시도는 ResilientLlmClient(STEP 10)가 맡으므로 SDK 자체 재시도는 끈다 (켜 두면 시도 횟수·로그가 어긋난다)
spring.ai.openai.max-retries=0
# 요청 타임아웃은 llm.timeout-ms 하나로 정한다
spring.ai.openai.chat.timeout=${llm.timeout-ms:30000}ms

# LLM Guard (STEP V5). 기능별 ON/OFF, 사용자별 분/일 제한, 기능별 일일 예산
app.llm-guard.enabled.recommendation=true
app.llm-guard.enabled.personalized=true
app.llm-guard.enabled.chat=true
app.llm-guard.limits.per-minute=10
app.llm-guard.limits.per-day=100
app.llm-guard.feature-limits.recommendation.per-minute=3
app.llm-guard.feature-limits.recommendation.per-day=20
app.llm-guard.feature-limits.personalized.per-minute=10
app.llm-guard.feature-limits.personalized.per-day=30
app.llm-guard.feature-limits.chat.per-minute=6
app.llm-guard.feature-limits.chat.per-day=50
app.llm-guard.feature-limits.guest.per-minute=2
app.llm-guard.feature-limits.guest.per-day=3
app.llm-guard.inflight-ttl-seconds=120
app.llm-guard.daily-budget.recommendation=5000
app.llm-guard.daily-budget.recommendation-guest=300
app.llm-guard.daily-budget.personalized=3000
app.llm-guard.daily-budget.chat=5000
app.llm-guard.max-tokens.recommendation=1200
app.llm-guard.max-tokens.personalized=600
app.llm-guard.max-tokens.chat=800
app.llm-guard.strikes.suspend-threshold=3
app.llm-guard.strikes.long-suspend-threshold=6
app.llm-guard.strikes.suspend-seconds=1800
app.llm-guard.strikes.long-suspend-seconds=86400

# OSIV 끔: 켜 두면 LLM 응답을 기다리는 동안에도 요청마다 DB 커넥션을 잡아 다른 API가 커넥션을 기다린다
# (10-27 측정: 추천 15건 동시 → 커넥션 10개 모두 점유, 약 검색 8.7초 → 끄면 점유 0, 38ms 이하. docs/logs/2026-10-27.md)
spring.jpa.open-in-view=false
